blueprint:
  name: "Универсальная автоматизация управления светом (движение + дверь + таймер) / Universal light control (motion + door + timer)"
  description: |
    <strong>Version: 1.5</strong><br>
    <strong>Change Log (v1.5):</strong> Замена input_number helper на number selector — устранена ошибка создания helper из UI blueprint (required key not provided @ data['max']/['min']/['name']). Добавлен min_version. / Replaced input_number helper with number selector — fixed helper creation error from blueprint UI. Added min_version.<br><br>
    <strong>Change Log (v1.4):</strong> Добавлен дополнительный state‑триггер для таймера (устранение ошибки фронтенда при описании триггера), улучшена совместимость с UI. / Added additional state trigger for timer (workaround for frontend "describe trigger" error), improved UI compatibility.<br><br>

    <strong>Основное что делает блупринт:</strong><br>
    Универсальная автоматизация для управления светом: включает свет при движении или открытии двери, запускает таймер при отсутствии движения и выключает свет по его завершении. Содержит встроенную защиту от «дребезга» датчиков и ложных срабатываний. Поддерживает глобальные условия и дополнительные действия после выключения.<br><br>

    <details>
    <summary>Еще мои блупринты</summary>
    <ul>
      <li><a href="https://github.com/smirnowegor/HomeAssistant_blueprints">Git</a></li>
    </ul>
    </details>

    <details>
    <summary>💡 Главная идея</summary>
    <p>Шаблон объединяет несколько источников триггеров и даёт гибкие настройки тайм-аута. Удобен для мест с нестабильно работающими датчиками благодаря программной фильтрации сигналов.</p>
    <ol>
      <li><strong>Надежность</strong> — игнорирует кратковременные ложные срабатывания датчиков движения.</li>
      <li><strong>Гибкость</strong> — длительность через number selector, поддержка условий и пост-действий.</li>
      <li><strong>Интеграция</strong> — выполнение любых действий (сцены, шторы) после выключения света.</li>
    </ol>
    </details>

    <details>
    <summary>⚙️ Как это работает (кратко)</summary>
    <ol>
      <li><strong>Старт:</strong> движение (длительностью >0.5с) или дверь → включаем свет, отменяем таймер.</li>
      <li><strong>Остановка движения:</strong> если движения нет более 2с → запускаем таймер на X минут.</li>
      <li><strong>Защита:</strong> блокировка повторного срабатывания (настраиваемая, по умолчанию 1 с) для предотвращения «петли».</li>
      <li><strong>Финиш:</strong> по завершении таймера — выключаем свет и выполняем доп. действия.</li>
    </ol>
    </details>

    <hr>

    <strong>What the blueprint does:</strong><br>
    Universal automation for lighting: turns lights on on motion or door open, starts a timer on motion off and turns lights off when finished. Features built-in sensor anti-bounce and loop protection. Supports global conditions and additional post-off actions.<br><br>

    <details>
    <summary>More blueprints</summary>
    <ul>
      <li><a href="https://github.com/smirnowegor/HomeAssistant_blueprints">Git</a></li>
    </ul>
    </details>

    <details>
    <summary>💡 Main idea (Click to expand)</summary>
    <p>This blueprint combines multiple trigger sources and provides flexible timeout settings. It is ideal for areas with "noisy" sensors thanks to software signal filtering.</p>
    <ol>
      <li><strong>Reliability</strong> — ignores short false motion signals (anti-bounce).</li>
      <li><strong>Flexibility</strong> — duration via number selector, supports conditions and post-actions.</li>
      <li><strong>Integration</strong> — run any actions (scripts, covers) after lights turn off.</li>
    </ol>
    </details>

    <details>
    <summary>⚙️ How it works (short)</summary>
    <ol>
      <li><strong>Start:</strong> motion (>0.5s) or door open → turn lights on and cancel timer.</li>
      <li><strong>Motion off:</strong> if no motion for >2s → start timer for X minutes.</li>
      <li><strong>Protection:</strong> configurable loop cooldown (default 1 s) to prevent re-triggering loops.</li>
      <li><strong>Finish:</strong> when timer finishes → turn lights off and run additional actions.</li>
    </ol>
    </details>

  domain: automation
  min_version: 2024.8.0
  source_url: https://github.com/smirnowegor/HomeAssistant_blueprints/blob/main/blueprints/automation/smirnowegor/DDmoveFullcontrol.yaml
  input:
    motion_sensors:
      name: "Датчики движения"
      default: []
      selector:
        entity:
          domain: binary_sensor
          device_class: [motion, occupancy]
          multiple: true
    door_sensor:
      name: "Датчик двери (опционально)"
      default: []
      selector:
        entity:
          domain: binary_sensor
          device_class: door
          multiple: true
    lights:
      name: "Свет"
      selector:
        target:
          entity: {domain: light}
    timer_entity:
      name: "Таймер (Helper)"
      description: "Создайте helper Timer вручную: Settings → Devices & services → Helpers → Create helper → Timer. Затем выберите его здесь."
      selector:
        entity:
          domain: timer
    off_delay_minutes:
      name: "Задержка выключения (минуты)"
      description: "Время в минутах до выключения света после прекращения движения."
      default: 5
      selector:
        number:
          min: 0
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: slider
    loop_cooldown_seconds:
      name: "Loop protection (seconds)"
      default: 1
      selector:
        number:
          min: 0
          max: 30
          step: 1
          unit_of_measurement: s
    timer_finished_actions:
      name: "Действия после выключения"
      default: []
      selector:
        action: {}
    global_conditions:
      name: "Глобальные условия"
      default: []
      selector:
        condition: {}

mode: parallel
max: 10

trigger:
  # 1. Движение обнаружено
  - platform: state
    entity_id: !input motion_sensors
    to: "on"
    for: "00:00:00.5"
    id: "motion_on"

  # 2. Движение прекратилось
  - platform: state
    entity_id: !input motion_sensors
    to: "off"
    for: "00:00:02"
    id: "motion_off"

  # 3. Дверь
  - platform: state
    entity_id: !input door_sensor
    to: "on"
    id: "door_opened"

  # 4. Таймер
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: !input timer_entity
    id: "timer_finished"

  # Доп. триггер: состояние таймера -> "idle" (защита от ошибки описания триггера в UI)
  - platform: state
    entity_id: !input timer_entity
    to: "idle"
    id: "timer_finished_state"

condition:
  # Проверка: если сработал триггер двери, но датчик не выбран, условие не проходит
  - condition: template
    value_template: >
      {% if trigger.id == 'door_opened' %}
        {{ trigger.entity_id is defined and trigger.entity_id != none and trigger.entity_id != '' }}
      {% else %}
        true
      {% endif %}
  - condition: and
    conditions: !input global_conditions

action:
  - variables:
      motion_entities: !input motion_sensors
      lights_entities: !input lights
      delay_minutes: !input off_delay_minutes
      loop_cooldown: !input loop_cooldown_seconds
      last_run_diff: >
        {{ as_timestamp(now()) - as_timestamp(this.attributes.last_triggered | default(0)) | float }}

  - choose:
      # --- СЦЕНАРИЙ А: ДВЕРЬ ---
      - conditions:
          - condition: trigger
            id: "door_opened"
        sequence:
          - action: light.turn_on
            target: !input lights
          - action: timer.cancel
            target: {entity_id: !input timer_entity}

      # --- СЦЕНАРИЙ Б: ДВИЖЕНИЕ ---
      - conditions:
          - condition: trigger
            id: "motion_on"
          - condition: template
            value_template: >
              {% set all_lights = expand(lights_entities) | list %}
              {% set all_off = all_lights | selectattr('state','eq','off') | list | count == (all_lights | count) %}
              {{ last_run_diff > loop_cooldown or all_off }}
        sequence:
          - action: light.turn_on
            target: !input lights
          - action: timer.cancel
            target: {entity_id: !input timer_entity}

      # --- СЦЕНАРИЙ В: ЗАПУСК ТАЙМЕРА ---
      - conditions:
          - condition: trigger
            id: "motion_off"
          - condition: template
            value_template: "{{ expand(motion_entities) | selectattr('state', 'eq', 'on') | list | count == 0 }}"
        sequence:
          - action: timer.start
            target: {entity_id: !input timer_entity}
            data:
              duration: >
                {% set m = delay_minutes | int %}
                {{ "%02d:%02d:00" | format(m // 60, m % 60) }}

      # --- СЦЕНАРИЙ Г: ФИНАЛ ---
      - conditions:
          - condition: template
            value_template: "{{ trigger.id in ['timer_finished','timer_finished_state'] }}"
          - condition: template
            value_template: "{{ expand(motion_entities) | selectattr('state', 'eq', 'on') | list | count == 0 }}"
        sequence:
          - action: light.turn_off
            target: !input lights
          - choose: []
            default: !input timer_finished_actions
