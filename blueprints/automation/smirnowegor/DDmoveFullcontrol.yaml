blueprint:
  name: "Универсальная автоматизация управления светом (движение + дверь + таймер) / Universal light automation (motion + door + timer)"
  description: |
    <strong>Version: 1.2</strong><br><br>

    <strong>Универсальная автоматизация для управления светом</strong><br>
    - Включает свет при движении или открытии двери, выключает по таймеру, поддерживает глобальные условия и дополнительные действия.<br><br>

    ## Как работает / How it works
    - Включает свет при движении. / Turns lights on when motion is detected.
    - При отсутствии движения запускает выбранный `timer.*` с длительностью из `input_number`. / When motion stops, starts the selected `timer.*` with duration from `input_number`.
    - По завершении таймера выключает свет и запускает дополнительные действия (если заданы). / When timer finishes, turns lights off and runs additional actions (if provided).
    - Опционально: при открытии двери — включение света и запуск таймера. / Optionally: opening a door turns lights on and starts the timer.
    - Можно задать глобальные условия (например: только ночью или только если кто-то дома). / You can set global conditions (e.g., only at night or only when someone is home).

    **Контакты автора / Author contacts:**
    - [Telegram канал про автоматизацию домов](https://t.me/u2smart4home)
    - [YouTube: Удобный дом](https://www.youtube.com/@udobni_dom)
    - [Яндекс.Дзен: Мой профиль](https://dzen.ru/id/5e32d0969929ba40059b5892)
    - [Teletype](https://teletype.in/@godisblind)

  domain: automation

  input:
    motion_sensors:
      name: "Датчики движения / Motion sensors"
      description: "Выберите один или несколько binary_sensor с классом occupancy (датчики движения). / Select one or more binary_sensor entities with occupancy class."
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    lights:
      name: "Целевые светильники или зона / Target lights or area"
      description: "Выберите один или несколько light.* или целую зону (будут включаться/выключаться только светильники). / Select one or more light.* entities or an area (only lights will be controlled)."
      selector:
        target:
          entity:
            domain: light

    timer_entity:
      name: "Таймер / Timer entity"
      description: "Выберите timer.* — будет использоваться для отсчёта времени до выключения света. / Choose a timer.* entity to count down before turning lights off."
      selector:
        entity:
          domain: timer

    delay_input_number:
      name: "Input number для времени ожидания (мин) / Input number: delay (minutes)"
      description: "Выберите input_number (в минутах), который задаёт длительность таймера. После заведения номера нужно поставить значение больше 0 для нормальной работы таймера. / Select an input_number (minutes) that sets the timer duration. Set value > 0 for normal operation."
      selector:
        entity:
          domain: input_number

    door_sensor:
      name: "Датчик двери (опционально) / Door sensor (optional)"
      description: "Выберите binary_sensor двери. При открытии двери свет включится и запустится таймер. Можно оставить пустым. / Select a door binary_sensor. When opened, lights turn on and timer starts. Leave empty if unused."
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    global_conditions:
      name: "Глобальные условия / Global conditions"
      description: "Эти условия должны быть истинны, чтобы автоматизация выполнялась. Например: только ночью, только если кто-то дома. / Conditions that must be true for the automation to run (e.g., only at night, only if someone is home)."
      default: []
      selector:
        condition: {}

    timer_finished_actions:
      name: "Действия при завершении таймера / Actions on timer finish"
      description: "Эти действия будут выполнены после выключения света, когда таймер завершится. Можно оставить пустым. / Actions to run after the timer finishes (optional)."
      default: []
      selector:
        action: {}

variables:
  delay_input: !input delay_input_number
  minutes: "{{ states(delay_input) | default('3') | float | int }}"
  motion_list: !input motion_sensors

trigger:
  - platform: state
    entity_id: !input motion_sensors
    to: "on"
    id: motion_detected

  - platform: state
    entity_id: !input motion_sensors
    to: "off"
    id: motion_stopped

  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: !input timer_entity
    id: timer_finished

  - platform: state
    entity_id: !input door_sensor
    to: "on"
    id: door_opened

condition: !input global_conditions

action:
  - choose:
      - conditions:
          - condition: trigger
            id: motion_detected
        sequence:
          - service: light.turn_on
            target: !input lights
          - service: timer.cancel
            target:
              entity_id: !input timer_entity

      - conditions:
          - condition: trigger
            id: motion_stopped
        sequence:
          - service: timer.start
            target:
              entity_id: !input timer_entity
            data:
              duration: >-
                {% set m = minutes | int %}
                {% set hh = (m // 60) %}
                {% set mm = (m % 60) %}
                {{ "%02d:%02d:00" | format(hh, mm) }}

      - conditions:
          - condition: trigger
            id: door_opened
        sequence:
          - service: light.turn_on
            target: !input lights
          - service: timer.start
            target:
              entity_id: !input timer_entity
            data:
              duration: >-
                {% set m = minutes | int %}
                {% set hh = (m // 60) %}
                {% set mm = (m % 60) %}
                {{ "%02d:%02d:00" | format(hh, mm) }}

      - conditions:
          - condition: trigger
            id: timer_finished
        sequence:
          - service: light.turn_off
            target: !input lights
          - choose: []
            default: !input timer_finished_actions
    default: []

mode: restart
