blueprint:
  name: "Универсальная автоматизация управления светом (движение + дверь + таймер)"
  description: |
  <strong>Version: 1.0</strong><br><br>
  
  <strong>Умный свет: Движение, Дверь и Таймер</strong><br>
  Универсальная автоматизация: включает свет при движении или открытии двери, выключает по таймеру, поддерживает глобальные условия и дополнительные действия.
  
  <details>
  <summary>Еще мои блупринты</summary>
  <ul>
      <li><a href="https://github.com/smirnowegor/HomeAssistant_blueprints">Git</a></li>
  </ul>
  </details>
  
  <details>
  <summary>💡 Главная идея (Нажмите, чтобы раскрыть) 👈</summary>
  <p>Этот шаблон решает типичные задачи управления освещением:</p>
  <ol>
      <li><strong>Автоматическое включение</strong> — свет включается при движении или при открытии двери.</li>
      <li><strong>Автоматическое выключение</strong> — таймер гарантирует, что свет не останется включённым зря.</li>
      <li><strong>Гибкие условия</strong> — можно задать глобальные условия выполнения (например, только ночью или только если кто-то дома).</li>
      <li><strong>Дополнительные действия</strong> — после выключения света можно запускать любые другие сценарии.</li>
  </ol>
  </details>
  
  <details>
  <summary>⚙️ Как это работает (Нажмите, чтобы раскрыть) 👈</summary>
  <p>Алгоритм:</p>
  <ol>
      <li><strong>Движение:</strong> при переходе датчика движения в состояние <code>on</code> — свет включается и текущий таймер отменяется.</li>
      <li><strong>Остановка движения:</strong> при переходе датчика в <code>off</code> — запускается выбранный <code>timer.*</code> на длительность из <code>input_number</code>.</li>
      <li><strong>Открытие двери (опционально):</strong> при срабатывании датчика двери — свет включается и запускается таймер.</li>
      <li><strong>Завершение таймера:</strong> по событию <code>timer.finished</code> — свет выключается и выполняются дополнительные действия (если заданы).</li>
      <li><strong>Глобальные условия:</strong> автоматизация выполняется только если истинны указанные условия (например, только ночью).</li>
  </ol>
  </details>
  
  <details>
  <summary>⚠️ Настройки (Inputs / Helpers) 👈</summary>
  <p>Для корректной работы укажите или создайте следующие helpers / entities:</p>
  <ul>
      <li><code>motion_sensors</code> — один или несколько <code>binary_sensor</code> с классом <code>occupancy</code> (датчики движения).</li>
      <li><code>lights</code> — целевые <code>light.*</code> (или зона), которые будут включаться/выключаться.</li>
      <li><code>timer_entity</code> — <code>timer.*</code>, используемый для отсчёта времени до выключения света.</li>
      <li><code>delay_input_number</code> — <code>input_number</code> (в минутах) для задания длительности таймера.</li>
      <li><code>door_sensor</code> — опциональный <code>binary_sensor</code> двери (можно не указывать).</li>
      <li><code>global_conditions</code> — условия (condition), при которых автоматизация разрешена (опционально).</li>
      <li><code>timer_finished_actions</code> — дополнительные действия (action), выполняемые после завершения таймера (опционально).</li>
  </ul>
  </details>
  
  <details>
  <summary>💡 Советы по настройке (Нажмите, чтобы раскрыть) 👈</summary>
  <ul>
      <li>Если у вас несколько датчиков движения, указывайте их все в <code>motion_sensors</code> — триггеры будут работать для любого из них.</li>
      <li>Для коридоров и лестниц удобно ставить короткий таймер (1–3 минуты), для комнат — больше (5–15 минут).</li>
      <li>Используйте <code>global_conditions</code>, чтобы автоматизация не срабатывала днём или когда никого нет дома.</li>
      <li>В <code>timer_finished_actions</code> можно добавить включение ночного света, отправку уведомления или запуск сцены.</li>
  </ul>
  </details>
  
