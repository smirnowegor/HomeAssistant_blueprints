  <hr>
  
  <strong>Smart Light: Motion, Door & Timer</strong><br>
  Universal automation: turns lights on by motion or door, turns off by timer, supports global conditions and extra actions.
  
  <details>
  <summary>More blueprints</summary>
  <ul>
      <li><a href="https://github.com/smirnowegor/HomeAssistant_blueprints">Git</a></li>
  </ul>
  </details>
  
  <details>
  <summary>💡 Main idea (Click to expand) 👈</summary>
  <ol>
      <li><strong>Automatic on</strong> — lights on by motion or door.</li>
      <li><strong>Automatic off</strong> — timer prevents lights staying on unnecessarily.</li>
      <li><strong>Flexible conditions</strong> — run only when specified conditions are true.</li>
      <li><strong>Extra actions</strong> — run scenes or notifications after lights off.</li>
  </ol>
  </details>
  
  <details>
  <summary>⚙️ How it works (Click to expand) 👈</summary>
  <ol>
      <li><strong>Motion:</strong> motion sensor → lights on; cancel running timer.</li>
      <li><strong>No motion:</strong> motion sensor off → start selected <code>timer.*</code> for duration from <code>input_number</code>.</li>
      <li><strong>Door (optional):</strong> door sensor on → lights on; start timer.</li>
      <li><strong>Timer finished:</strong> <code>timer.finished</code> → lights off; run additional actions if provided.</li>
  </ol>
  </details>
  
  <details>
  <summary>⚠️ Requirements (Inputs) 👈</summary>
  <ul>
      <li><code>motion_sensors</code> — motion binary_sensors.</li>
      <li><code>lights</code> — target light entities or area.</li>
      <li><code>timer_entity</code> — timer.* entity.</li>
      <li><code>delay_input_number</code> — input_number for minutes.</li>
      <li><code>door_sensor</code> — optional door binary_sensor.</li>
      <li><code>global_conditions</code> — optional conditions.</li>
      <li><code>timer_finished_actions</code> — optional actions to run after timer ends.</li>
  </ul>
  </details>
  domain: automation
  input:
    motion_sensors:
      name: "Датчики движения"
      description: "Выберите один или несколько binary_sensor с классом occupancy (датчики движения)."
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    lights:
      name: "Целевые светильники или зона"
      description: "Выберите один или несколько light.* или целую зону (будут включаться/выключаться только светильники)."
      selector:
        target:
          entity:
            domain: light
    timer_entity:
      name: "Таймер"
      description: "Выберите timer.* — будет использоваться для отсчёта времени до выключения света."
      selector:
        entity:
          domain: timer
    delay_input_number:
      name: "Input number для времени ожидания"
      description: "Выберите input_number (в минутах), который задаёт длительность таймера. После заведения номера нужно поставить значение больше 0 для нормальной работы таймера"
      selector:
        entity:
          domain: input_number
    door_sensor:
      name: "Датчик двери (опционально)"
      description: "Выберите binary_sensor двери. При открытии двери свет включится и запустится таймер. Можно оставить пустым."
      # ИСПРАВЛЕНИЕ 1: default: []
      default: []
      selector:
        entity:
          domain: binary_sensor
          # ИСПРАВЛЕНИЕ 2: multiple: true
          multiple: true
    global_conditions:
      name: "Глобальные условия"
      description: "Эти условия должны быть истинны, чтобы автоматизация выполнялась. Например: только ночью, только если кто-то дома."
      default: []
      selector:
        condition: {}
    timer_finished_actions:
      name: "Действия при завершении таймера"
      description: "Эти действия будут выполнены после выключения света, когда таймер завершится. Можно оставить пустым."
      default: []
      selector:
        action: {}

variables:
  delay_input: !input delay_input_number
  minutes: "{{ states(delay_input) | default('3') | float | int }}"
  # 'door_sensor' и 'motion_list' здесь больше не нужны
  # (если только вы не используете их в 'global_conditions')
  # Оставляю 'motion_list' на всякий случай, т.к. он был у вас.
  motion_list: !input motion_sensors


trigger:
  - platform: state
    entity_id: !input motion_sensors
    to: "on"
    id: motion_detected
  - platform: state
    entity_id: !input motion_sensors
    to: "off"
    id: motion_stopped
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: !input timer_entity
    id: timer_finished
  # ИСПРАВЛЕНИЕ 3: Возвращаем platform: state.
  # Теперь он будет работать, т.к. !input door_sensor
  # будет [] (пустым списком), если ничего не выбрано.
  - platform: state
    entity_id: !input door_sensor
    to: "on"
    id: door_opened

# Глобальные условия
condition: !input global_conditions

action:
  - choose:
      - conditions:
          - condition: trigger
            id: motion_detected
        sequence:
          - service: light.turn_on
            target: !input lights
          - service: timer.cancel
            target:
              entity_id: !input timer_entity
      - conditions:
          - condition: trigger
            id: motion_stopped
        sequence:
          - service: timer.start
            target:
              entity_id: !input timer_entity
            data:
              duration: >-
                {% set m = minutes | int %}
                {% set hh = (m // 60) %}
                {% set mm = (m % 60) %}
                {{ "%02d:%02d:00" | format(hh, mm) }}
      - conditions:
          - condition: trigger
            id: door_opened
        sequence:
          - service: light.turn_on
            target: !input lights
          - service: timer.start
            target:
              entity_id: !input timer_entity
            data:
              duration: >-
                {% set m = minutes | int %}
                {% set hh = (m // 60) %}
                {% set mm = (m % 60) %}
                {{ "%02d:%02d:00" | format(hh, mm) }}
      - conditions:
          - condition: trigger
            id: timer_finished
        sequence:
          - service: light.turn_off
            target: !input lights
          - choose: []
            default: !input timer_finished_actions
    default: []
mode: restart
